name: ClinAnx P0 contract verification

on:
  push:
    branches:
      - integration/clinanx-p0-contract-first
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  p0-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: P0 focused tests
        run: flutter test test/contracts test/gateway_contract_test.dart
      - name: Full regression suite
        run: flutter test
      - name: Static analysis
        if: always()
        run: flutter analyze
