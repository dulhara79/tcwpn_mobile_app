name: P1 P2 dashboard checks

on:
  push:
    branches:
      - integration/clinanx-p1-p2-production-wiring-cleanup
      - fix/clinanx-p1-p2-verification-gate
      - integration/clinanx-p3-patient-overview
      - integration/clinanx-p4-attention-events
      - integration/clinanx-p5a-signals-data-quality
      - integration/clinanx-p5b-timeline-clinical-notes
      - integration/clinanx-p5c-evidence-clinician-assessment
      - integration/clinanx-p6-notifications
      - integration/clinanx-p6-client-first-contract
      - integration/clinanx-p7-hardening
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Focused tests
        run: >-
          flutter test
          test/contracts
          test/repositories
          test/gateway_contract_test.dart
          test/p1_p2_api_failure_test.dart
          test/p1_p2_authority_cleanup_test.dart
          test/p3_patient_overview_authority_test.dart
          test/p4_attention_event_authority_test.dart
          test/p5a_assessment_authority_test.dart
          test/p5b_timeline_clinical_notes_authority_test.dart
          test/p6_notification_authority_test.dart
          test/p7_clinician_storage_scope_test.dart
          test/attention_notification_controller_test.dart
          test/attention_notification_store_test.dart
          test/composite_dashboard_repository_test.dart
          test/dashboard_controller_test.dart
          test/dashboard_cache_test.dart
          test/patient_overview_controller_test.dart
          test/timeline_controller_test.dart
          test/clinical_notes_controller_test.dart
          test/supporting_evidence_controller_test.dart
          test/clinician_assessment_controller_test.dart
          test/attention_events_controller_test.dart
          test/attention_event_detail_controller_test.dart
          test/features/attention_events/activity_screen_test.dart
          test/features/attention_events/attention_event_detail_screen_test.dart
          test/features/dashboard/server_dashboard_screen_test.dart
          test/features/patients
          test/shell_navigation_structure_test.dart
      - name: Focused analysis
        run: flutter analyze
      - name: Authority and forbidden-pattern checks
        shell: bash
        run: |
          if find lib -type f -name '*.dart' -print0 | xargs -0 grep -nE '/v1/subjects/attach|_raiseIfEscalated|KpiDashboardScreen|ClinicalDashboardStats'; then
            echo 'Forbidden retired authority/compatibility path found in active Dart.'
            exit 1
          fi
          if grep -R -nE 'AlertBandX\.fromScore' lib/features/dashboard lib/features/patients/patient_overview_screen.dart lib/features/attention_events --include='*.dart' 2>/dev/null; then
            echo 'Server-backed clinician views must not derive authoritative risk locally.'
            exit 1
          fi
          if grep -R -nE "['\"]/?predict['\"]" lib/features/patients/patient_overview_screen.dart lib/state/patient_overview_controller.dart lib/features/attention_events lib/state/attention_event_detail_controller.dart 2>/dev/null; then
            echo 'Clinician event flows must not call model prediction directly.'
            exit 1
          fi
          if grep -nE "'/v1/me'|'/v1/clinicians/me/dashboard'|/assessment/latest'" lib/data/repositories/central_backend_repositories.dart; then
            echo 'Unverified non-Phase-6 target endpoint was live-wired.'
            exit 1
          fi
          if grep -n 'roster\.unacknowledgedCount' lib/features/shell.dart; then
            echo 'P4 Activity count must not use legacy local alert authority.'
            exit 1
          fi
          if grep -R -nE "['\"]/?predict['\"]|/contributions|/data-quality|AlertBandX\.fromScore" \
            lib/features/patients/signals_contributions_screen.dart \
            lib/features/patients/data_quality_screen.dart 2>/dev/null; then
            echo 'P5A deep views must not call models, guess routes, or derive risk locally.'
            exit 1
          fi
          if grep -R -nE "['\"]/?predict['\"]|/clinical-notes/history|/notes/history|AlertBandX\.fromScore|weight \* score|largest weight" \
            lib/data/repositories/p5b_repositories.dart \
            lib/state/timeline_controller.dart \
            lib/state/clinical_notes_controller.dart \
            lib/features/patients/timeline_screen.dart \
            lib/features/patients/clinical_notes_screen.dart 2>/dev/null; then
            echo 'P5B must not call models directly, guess note-history routes, or derive clinical authority locally.'
            exit 1
          fi
          if grep -R -nE 'ClinicalAlert\(|AlertBandX\.fromScore|current_score|forecast_score|acknowledged_by|resolved_by' \
            lib/core/notifications \
            lib/data/local/attention_notification_store.dart \
            lib/state/attention_notification_controller.dart 2>/dev/null; then
            echo 'P6 notification delivery must not manufacture clinical authority.'
            exit 1
          fi
      - name: Full tests visibility
        if: always()
        continue-on-error: true
        run: flutter test
      - name: Full analysis visibility
        if: always()
        continue-on-error: true
        run: flutter analyze
