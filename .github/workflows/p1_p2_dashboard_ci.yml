name: P1 P2 dashboard checks

on:
  push:
    branches:
      - integration/clinanx-p1-p2-production-wiring-cleanup
      - fix/clinanx-p1-p2-verification-gate
      - integration/clinanx-p3-patient-overview
      - integration/clinanx-p4-attention-events
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Focused tests
        run: >-
          flutter test
          test/contracts
          test/repositories
          test/gateway_contract_test.dart
          test/p1_p2_api_failure_test.dart
          test/p1_p2_authority_cleanup_test.dart
          test/p3_patient_overview_authority_test.dart
          test/composite_dashboard_repository_test.dart
          test/dashboard_controller_test.dart
          test/dashboard_cache_test.dart
          test/patient_overview_controller_test.dart
          test/features/dashboard/server_dashboard_screen_test.dart
          test/features/patients/patient_overview_screen_test.dart
          test/features/patients/patients_screen_navigation_test.dart
          test/shell_navigation_structure_test.dart
      - name: Focused analysis
        run: >-
          flutter analyze
          lib/domain/contracts
          lib/domain/repositories
          lib/data/repositories
          lib/data/local/dashboard_cache.dart
          lib/state/async_data_state.dart
          lib/state/dashboard_controller.dart
          lib/state/patient_overview_controller.dart
          lib/state/controllers.dart
          lib/data/api/api_client.dart
          lib/data/api/gateways.dart
          lib/features/alerts/alerts_screen.dart
          lib/features/dashboard/server_dashboard_screen.dart
          lib/features/patients/patient_overview_screen.dart
          lib/features/patients/patients_screen.dart
          lib/features/shell.dart
          test/repositories
          test/gateway_contract_test.dart
          test/p1_p2_authority_cleanup_test.dart
          test/p3_patient_overview_authority_test.dart
          test/patient_overview_controller_test.dart
          test/features/dashboard/server_dashboard_screen_test.dart
          test/features/patients/patient_overview_screen_test.dart
          test/features/patients/patients_screen_navigation_test.dart
          test/shell_navigation_structure_test.dart
      - name: Authority and forbidden-pattern checks
        shell: bash
        run: |
          if find lib -type f -name '*.dart' -print0 | xargs -0 grep -nE '/v1/subjects/attach|_raiseIfEscalated|KpiDashboardScreen|ClinicalDashboardStats'; then
            echo 'Forbidden retired authority/compatibility path found in active Dart.'
            exit 1
          fi
          if grep -R -nE 'AlertBandX\.fromScore' lib/features/dashboard lib/features/patients/patient_overview_screen.dart --include='*.dart' 2>/dev/null; then
            echo 'Server-backed clinician views must not derive authoritative risk locally.'
            exit 1
          fi
          if grep -R -nE "['\"]/?predict['\"]" lib/features/patients/patient_overview_screen.dart lib/state/patient_overview_controller.dart 2>/dev/null; then
            echo 'P3 must not call C3 prediction directly.'
            exit 1
          fi
          if grep -nE "'/v1/me'|'/v1/clinicians/me/dashboard'|/assessment/latest'" lib/data/repositories/central_backend_repositories.dart; then
            echo 'Unverified target endpoint was live-wired.'
            exit 1
          fi
      - name: Full tests visibility
        if: always()
        continue-on-error: true
        run: flutter test
      - name: Full analysis visibility
        if: always()
        continue-on-error: true
        run: flutter analyze
