name: Session sign-out regression

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: cp lib/core/config/env.example.dart lib/core/config/env.dart
      - run: flutter pub get
      - run: flutter test
